name: Deploy to Lightsail

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy tested commit over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set LIGHTSAIL_HOST in the production environment}"
          : "${SSH_KEY:?Set LIGHTSAIL_SSH_KEY in the production environment}"
          : "${SSH_KNOWN_HOSTS:?Set LIGHTSAIL_KNOWN_HOSTS in the production environment}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo 'Invalid SSH host'; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "ubuntu@$SSH_HOST" "bash -s -- '$GITHUB_SHA'" < scripts/deploy-lightsail.sh
